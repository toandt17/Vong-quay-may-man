<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a8a4b"/>
      <stop offset="100%" stop-color="#056839"/>
    </linearGradient>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3d3d"/>
      <stop offset="100%" stop-color="#ED1C24"/>
    </linearGradient>
  </defs>

  <!-- Phần đế mũi tên (tam giác ngược màu xanh lá) -->
  <polygon points="15,15 35,15 25,5" fill="url(#greenGradient)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Phần đầu mũi tên (tam giác đỏ) -->
  <polygon points="15,15 35,15 25,30" fill="url(#redGradient)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Viền tròn -->
  <circle cx="25" cy="15" r="8" fill="#ffffff" stroke="#056839" stroke-width="1.5"/>

  <!-- Hiệu ứng lấp lánh -->
  <circle cx="22" cy="12" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="28" cy="12" r="1" fill="#ffffff" opacity="0.5"/>
</svg>
